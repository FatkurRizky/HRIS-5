<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kerabat Admin - Pengaturan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0f17; color: #94a3b8; }
        .card-bg { background-color: #111827; }
        .nav-active { border-color: #a855f7; box-shadow: 0 0 10px rgba(168,85,247,0.2); color: white; }
        .text-purple-glow { color: #d8b4fe; }
        
        /* Custom checkbox style to match design */
        input[type="checkbox"] {
            -webkit-appearance: none;
            appearance: none;
            background-color: #1f2937; /* gray-800 */
            border: 1px solid #374151; /* gray-700 */
            border-radius: 0.25rem;
            display: grid;
            place-content: center;
        }
        input[type="checkbox"]::before {
            content: "";
            width: 0.65em;
            height: 0.65em;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em white;
            background-color: white;
            transform-origin: bottom left;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }
        input[type="checkbox"]:checked {
            background-color: #8b5cf6; /* purple-500 */
            border-color: #8b5cf6;
        }
        input[type="checkbox"]:checked::before {
            transform: scale(1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans">
    <!-- Navbar -->
    <nav class="flex items-center justify-between px-6 py-4 border-b border-gray-800">
        <div class="flex items-center space-x-6">
            <h1 class="text-xl font-semibold text-purple-glow">Kerabat Admin</h1>
            <span class="text-[10px] border border-gray-700 px-2 py-1 rounded bg-gray-800/50 text-gray-300 font-medium">SUPER ADMIN</span>
            <a href="ikhtisar.html" class="hover:text-white px-4 py-2 transition text-sm">Ikhtisar</a>
            <a href="pengguna.html" class="hover:text-white px-4 py-2 transition text-sm">Pengguna dan peran</a>
            <a href="pengaturan.html" class="nav-active px-4 py-2 rounded-lg transition text-sm">Pengaturan sistem</a>
        </div>
        <div class="flex items-center space-x-4">
            <span class="text-sm text-gray-400">admin@kerabat.id</span>
            <a href="#" class="flex items-center space-x-2 text-sm text-gray-400 hover:text-white bg-gray-800/50 hover:bg-[#ef4444] border border-gray-700 hover:border-[#ef4444] px-3 py-1.5 rounded-lg transition-all duration-200">
                <span>Keluar</span>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9" />
                </svg>
            </a>
        </div>
    </nav>

    <!-- Content -->
    <main class="flex-1 p-6">
        <div class="card-bg border border-gray-800 rounded-xl p-8 max-w-4xl">
            <h2 class="text-xl text-white font-semibold mb-8">Pengaturan sistem</h2>
            
            <div class="mb-6">
                <label class="block text-sm mb-2 text-gray-200 font-medium">Radius absensi (meter)</label>
                <input type="text" value="100" class="w-full bg-[#0b0f17] border border-gray-800 rounded-lg px-4 py-3 focus:outline-none focus:border-purple-500 text-gray-200 transition">
            </div>

            <div class="grid grid-cols-2 gap-6 mb-8">
                <div class="relative">
                    <label class="block text-sm mb-2 text-gray-200 font-medium">Jam masuk</label>
                    <input type="text" value="08:00 AM" class="w-full bg-[#0b0f17] border border-gray-800 rounded-lg px-4 py-3 focus:outline-none focus:border-purple-500 text-gray-200 transition">
                    <svg class="w-4 h-4 text-gray-500 absolute right-4 bottom-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <div class="relative">
                    <label class="block text-sm mb-2 text-gray-200 font-medium">Jam pulang</label>
                    <input type="text" value="05:00 PM" class="w-full bg-[#0b0f17] border border-gray-800 rounded-lg px-4 py-3 focus:outline-none focus:border-purple-500 text-gray-200 transition">
                    <svg class="w-4 h-4 text-gray-500 absolute right-4 bottom-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
            </div>

            <div class="space-y-6 mb-10 border-t border-gray-800 pt-6">
                <label class="flex items-center justify-between cursor-pointer group">
                    <div>
                        <h3 class="text-gray-200 font-medium mb-1">Registrasi mandiri</h3>
                        <p class="text-sm text-gray-500">Karyawan boleh membuat akun dengan ID karyawan</p>
                    </div>
                    <input type="checkbox" checked class="w-5 h-5 cursor-pointer">
                </label>
                
                <label class="flex items-center justify-between cursor-pointer group border-t border-gray-800/50 pt-6">
                    <div>
                        <h3 class="text-gray-200 font-medium mb-1">Verifikasi dua langkah wajib</h3>
                        <p class="text-sm text-gray-500">Untuk HR dan SuperAdmin</p>
                    </div>
                    <input type="checkbox" class="w-5 h-5 cursor-pointer">
                </label>

                <label class="flex items-center justify-between cursor-pointer group border-t border-gray-800/50 pt-6">
                    <div>
                        <h3 class="text-gray-200 font-medium mb-1">Kunci absensi otomatis tanggal 25</h3>
                        <p class="text-sm text-gray-500">Cut-off payroll</p>
                    </div>
                    <input type="checkbox" checked class="w-5 h-5 cursor-pointer">
                </label>
            </div>

            <button class="bg-[#cba6f7] hover:bg-[#b48eed] text-black font-semibold px-6 py-2.5 rounded-lg transition shadow-lg shadow-purple-900/20 text-sm">
                Simpan pengaturan
            </button>
        </div>
    </main>
</body>
</html>
