<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persetujuan - Kerabat HRIS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="sidebar.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#f0f4f8] flex text-gray-800 min-h-screen">
    <app-sidebar></app-sidebar>

    <main class="flex-1 p-5 md:p-8 pt-20 md:pt-8 overflow-y-auto">
        <div class="mb-6 md:mb-8 border-b border-gray-200 pb-4">
            <h1 class="text-2xl md:text-3xl font-bold text-gray-900 mb-2">Persetujuan</h1>
            <p class="text-sm md:text-base text-gray-500">Keputusan Anda diteruskan ke HR sebagai tahap akhir</p>
        </div>

        <div class="max-w-4xl">
            <!-- BARIS SEARCH & FILTER -->
            <div class="flex flex-col sm:flex-row gap-4 justify-between items-center mb-6">
                <!-- Search Bar -->
                <div class="relative w-full sm:w-72">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                    </div>
                    <input type="text" id="searchInput" class="block w-full pl-10 pr-3 py-2.5 border border-gray-200 rounded-lg leading-5 bg-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#2a5b8a] focus:border-[#2a5b8a] text-sm transition-colors shadow-sm" placeholder="Cari nama karyawan...">
                </div>

                <!-- Dropdown Urutkan -->
                <div class="w-full sm:w-auto">
                    <select id="sortFilter" class="block w-full px-4 py-2.5 text-gray-700 border-gray-200 border rounded-lg focus:outline-none focus:ring-2 focus:ring-[#2a5b8a] focus:border-[#2a5b8a] text-sm bg-white cursor-pointer transition-colors shadow-sm">
                        <option value="terbaru">Urutkan: Terbaru</option>
                        <option value="terlama">Urutkan: Terlama</option>
                        <option value="nama_az">Nama: A - Z</option>
                        <option value="nama_za">Nama: Z - A</option>
                        <option value="tipe_cuti">Tipe: Cuti</option>
                        <option value="tipe_sakit">Tipe: Sakit</option>
                        <option value="tipe_izin">Tipe: Izin</option>
                    </select>
                </div>
            </div>

            <!-- Daftar Permohonan -->
            <div id="requestContainer" class="space-y-4">
                
                <!-- Permohonan 1 -->
                <div class="request-card bg-white rounded-xl shadow-sm border border-gray-100 p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4" 
                     data-name="Kevin Santoso" data-type="sakit" data-time="3">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 flex-shrink-0 rounded-full bg-[#fef3c7] text-[#b45309] flex items-center justify-center font-bold text-lg">KS</div>
                        <div>
                            <h4 class="font-semibold text-gray-900 text-lg">Kevin Santoso</h4>
                            <p class="text-gray-500 text-sm mt-0.5">Sakit, 2 hari (20 - 21 Okt)</p>
                        </div>
                    </div>

                    <div class="flex gap-3 w-full sm:w-auto mt-2 sm:mt-0">
                        <button class="flex-1 sm:flex-none px-6 py-2 rounded-lg border border-gray-300 text-gray-700 font-medium hover:bg-gray-50 transition">Tolak</button>
                        <button class="flex-1 sm:flex-none px-6 py-2 rounded-lg bg-[#22c55e] text-white font-medium hover:bg-green-600 transition">Setujui</button>
                    </div>
                </div>

                <!-- Permohonan 2 -->
                <div class="request-card bg-white rounded-xl shadow-sm border border-gray-100 p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4"
                     data-name="Dewi Lestari" data-type="cuti" data-time="2">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 flex-shrink-0 rounded-full bg-[#e8f0fe] text-[#1967d2] flex items-center justify-center font-bold text-lg">DL</div>
                        <div>
                            <h4 class="font-semibold text-gray-900 text-lg">Dewi Lestari</h4>
                            <p class="text-gray-500 text-sm mt-0.5">Cuti tahunan, 3 hari (3 - 5 Nov)</p>
                        </div>
                    </div>
                    <div class="flex gap-3 w-full sm:w-auto mt-2 sm:mt-0">
                        <button class="flex-1 sm:flex-none px-6 py-2 rounded-lg border border-gray-300 text-gray-700 font-medium hover:bg-gray-50 transition">Tolak</button>
                        <button class="flex-1 sm:flex-none px-6 py-2 rounded-lg bg-[#22c55e] text-white font-medium hover:bg-green-600 transition">Setujui</button>
                    </div>
                </div>

                <!-- Permohonan 3 -->
                <div class="request-card bg-white rounded-xl shadow-sm border border-gray-100 p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4"
                     data-name="Bima Pratama" data-type="izin" data-time="1">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 flex-shrink-0 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-lg">BP</div>
                        <div>
                            <h4 class="font-semibold text-gray-900 text-lg">Bima Pratama</h4>
                            <p class="text-gray-500 text-sm mt-0.5">Izin, 1 hari (28 Okt)</p>
                        </div>
                    </div>
                    <div class="flex gap-3 w-full sm:w-auto mt-2 sm:mt-0">
                        <button class="flex-1 sm:flex-none px-6 py-2 rounded-lg border border-gray-300 text-gray-700 font-medium hover:bg-gray-50 transition">Tolak</button>
                        <button class="flex-1 sm:flex-none px-6 py-2 rounded-lg bg-[#22c55e] text-white font-medium hover:bg-green-600 transition">Setujui</button>
                    </div>
                </div>

                <!-- Pesan Kosong -->
                <div id="emptyMessage" class="hidden text-center py-8 text-gray-500">
                    Tidak ada data yang sesuai dengan pencarian/filter.
                </div>

            </div>
        </div>
    </main>

    <!-- SCRIPT LOGIKA PENCARIAN & FILTER -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const searchInput = document.getElementById('searchInput');
            const sortFilter = document.getElementById('sortFilter');
            const container = document.getElementById('requestContainer');
            const emptyMessage = document.getElementById('emptyMessage');
            
            const originalCards = Array.from(document.querySelectorAll('.request-card'));

            function processFilters() {
                const keyword = searchInput.value.toLowerCase();
                const filterValue = sortFilter.value;
                
                let filteredCards = originalCards.filter(card => {
                    const name = card.getAttribute('data-name').toLowerCase();
                    return name.includes(keyword);
                });

                if (filterValue.startsWith('tipe_')) {
                    const type = filterValue.replace('tipe_', '');
                    filteredCards = filteredCards.filter(card => card.getAttribute('data-type') === type);
                } else if (filterValue === 'nama_az') {
                    filteredCards.sort((a, b) => a.getAttribute('data-name').localeCompare(b.getAttribute('data-name')));
                } else if (filterValue === 'nama_za') {
                    filteredCards.sort((a, b) => b.getAttribute('data-name').localeCompare(a.getAttribute('data-name')));
                } else if (filterValue === 'terbaru') {
                    filteredCards.sort((a, b) => b.getAttribute('data-time') - a.getAttribute('data-time'));
                } else if (filterValue === 'terlama') {
                    filteredCards.sort((a, b) => a.getAttribute('data-time') - b.getAttribute('data-time'));
                }

                Array.from(container.children).forEach(child => {
                    if (child.id !== 'emptyMessage') {
                        container.removeChild(child);
                    }
                });

                filteredCards.forEach(card => container.insertBefore(card, emptyMessage));

                if (filteredCards.length === 0) {
                    emptyMessage.classList.remove('hidden');
                } else {
                    emptyMessage.classList.add('hidden');
                }
            }

            searchInput.addEventListener('input', processFilters);
            sortFilter.addEventListener('change', processFilters);
        });
    </script>
</body>
</html>
